<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APEX-R POS System</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/logo.png">
  <link rel="preload" as="image" href="/images/brand/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <div class="app-splash" id="app-splash" aria-hidden="true">
    <div class="app-splash-brand">
      <img src="/images/brand/logo.png" alt="">
      <span>APEX-R POS SYSTEM</span>
    </div>
  </div>
  <a class="brand auth-brand" href="/"><img class="brand-logo" src="/images/brand/logo.png" alt=""> APEX-R POS System</a>
  <main class="auth-card">
    <div class="auth-heading"><span class="brand-mark"><i class="fa-solid fa-shop"></i></span><h1 id="auth-title">Admin Login</h1><p id="auth-subtitle">Sign in to your APEX-R POS account</p></div>
    <div id="auth-message" class="notice hidden" role="status"></div>
    <form id="login-form" class="form-stack">
      <label>Email address<input name="email" type="email" autocomplete="username" required placeholder="you@yourshop.com"></label>
      <label>Password<span class="password-field"><input name="password" type="password" autocomplete="current-password" required minlength="10" placeholder="At least 10 characters"><button class="password-toggle" type="button" data-toggle-password aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></span></label>
      <button class="button button-primary button-full" type="submit">Sign in <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <form id="register-form" class="form-stack hidden">
      <label>Business name<input name="businessName" required minlength="2" maxlength="120" placeholder="Your shop name"></label>
      <label>WhatsApp number<input name="whatsapp" type="tel" autocomplete="tel" required placeholder="94771234567"><small>Include the country code; digits only is best.</small></label>
      <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@yourshop.com"></label>
      <label>Password<span class="password-field"><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="At least 10 characters"><button class="password-toggle" type="button" data-toggle-password aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></span></label>
      <label>Admin Access Code<input name="adminAccessCode" type="password" autocomplete="off" required placeholder="Enter your invite code"></label>
      <button class="button button-primary button-full" type="submit">Register shop</button>
      <p class="form-note">You can start using your shop portal as soon as registration is complete. If payment becomes overdue, the platform administrator may suspend access.</p>
    </form>
    <p class="auth-switch" id="auth-switch">New here? <a href="?mode=register">Register your shop</a></p>
    <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/splash.js"></script>
</body>
</html>
